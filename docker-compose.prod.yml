# docker-compose.prod.yml — Production overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This adds:
#   - Caddy reverse proxy with automatic HTTPS
#   - Removes dev-only port bindings (DB, Redis, MinIO exposed only internally)
#   - Production resource tuning

services:
  # ---------- Caddy Reverse Proxy ----------
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    networks:
      - frontend
      - backend

  # ---------- Override: API no longer needs host port -----
  api:
    ports: !reset []   # Only accessible via Caddy
    environment:
      - APP_ENV=production

  # ---------- Override: Frontend no longer needs host port -----
  frontend:
    ports: !reset []   # Only accessible via Caddy
    environment:
      - NODE_ENV=production

  # ---------- Override: DB — no host port in prod ----------
  db:
    ports: !reset []

  # ---------- Override: Redis — no host port in prod ----------
  redis:
    ports: !reset []

  # ---------- Override: MinIO — no host port in prod ----------
  minio:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
